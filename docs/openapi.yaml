          summary: OpenVINO・GPU・int8
          path: data/hardware-profile.json
          tuning:
            generated_at: "2026-10-31T20:31:52+08:00"
            hardware:
              os: Windows 11
              cpu: Intel(R) Core(TM) Ultra 7 155U
              physical_cores: 12
              usable_threads: 14
              memory_total_gb: 31.7
              memory_available_gb: 18.6
              openvino_devices:
                CPU:
                  name: Intel(R) Core(TM) Ultra 7 155U
                  precisions: [FP32, INT8, BIN, EXPORT_IMPORT]
                  type: integrated
                GPU:
                  name: Intel(R) Graphics (iGPU)
                  precisions: [FP32, BIN, FP16, INT8, GPU_USM_MEMORY, EXPORT_IMPORT]
                  type: integrated
                  memory_bytes: 17754488832
              nvidia_gpus: []
              amd_gpu_tools: false
              torch_gpus: []
            sample:
              model: MediaTek-Research/Breeze-ASR-25
              seconds: 29.11
              source: https://huggingface.co/datasets/ky552/ML2021_ASR_ST
            candidates:
              - label: Intel(R) Core(TM) Ultra 7 155U（OpenVINO CPU・int4）
                engine: openvino
                device: CPU
                weight_format: int4
                torch_dtype: null
                torch_num_beams: null
                status: rejected
                load_seconds: 6.06
                transcribe_seconds: 11.14
                memory_bytes: 1766014976
                rtf: 0.383
