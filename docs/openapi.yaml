          - id: MediaTek-Research/Breeze-ASR-25
            name: Breeze ASR 25
            tagline: 華語・中英夾雜
            description: 強化台灣華語與中英混用（句內、句間切換）辨識，時間戳對齊佳，適合產生字幕。
            backend: local
            hotwords: true
            state: ready
            error: null
            seconds_per_audio_second: 0.405
          - id: MediaTek-Research/Breeze-ASR-26
            name: Breeze ASR 26
            tagline: 台語 → 華語漢字
            description: 台語（台灣閩南語）語音辨識，以約一萬小時台語語音微調；輸出為華語漢字，不是台語正字。
            backend: local
