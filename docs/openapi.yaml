openapi: 3.2.1
$self: https://raw.githubusercontent.com/Scorpio-meow/ListenMiao/main/docs/openapi.yaml
info:
  title: ListenMiao
  summary: 本機語音辨識服務的 HTTP API：上傳錄音、取得逐字稿、編輯字幕、匯出檔案與燒錄字幕。
  version: 0.7.2
  license:
    name: MIT
    identifier: MIT
  contact:
    name: ListenMiao
    url: https://github.com/Scorpio-meow/ListenMiao
  description: |
    ListenMiao 的網頁介面用的就是這組 API。服務跑在自己的電腦上，沒有帳號；預設只聽 `127.0.0.1`，要讓其他電腦連線請見部署文件。

    ## 存取權杖

    `.env` 的 `ASR_ACCESS_TOKEN` 設定了權杖時（`ASR_HOST` 不是本機位址就一定要設），除了 `GET /api/health`、`POST /api/session` 與網頁本身的靜態檔案，每個請求都要帶權杖，否則回 401 與 `WWW-Authenticate: Bearer`：

    - 程式：`Authorization: Bearer <權杖>`。
    - 瀏覽器：先用 `POST /api/session` 登入，之後靠 `breeze_asr_session` cookie。

    `ASR_ACCESS_TOKEN` 是 `off` 時不檢查，兩種都不用帶。

    ## 一次完整的辨識

    1. `POST /api/jobs` 以 `multipart/form-data` 送出音訊檔與選項，服務回 202 與工作編號 `id`。
    2. 反覆呼叫 `GET /api/jobs/{job_id}`（網頁每秒一次），直到 `status` 是 `succeeded`、`failed` 或 `cancelled`。
    3. 成功時用 `GET /api/jobs/{job_id}/export/{fmt}` 下載需要的格式，或用 `POST /api/jobs/{job_id}/renders` 把字幕燒進影片。

    ## 錯誤格式

    | 情況 | 狀態碼 | 內容 |
    | --- | --- | --- |
    | 服務判斷的錯誤 | 4xx、503 | `{"detail": "原因"}`，原因是中文句子 |
    | 欄位缺少或型別錯誤 | 422 | `{"detail": [{"loc": [...], "msg": "...", "type": "..."}]}`，`detail` 是陣列 |
    | 路徑不存在 | 404 | `{"detail": "Not Found"}` |
    | 方法不對 | 405 | `{"detail": "Method Not Allowed"}` |
    | 未預期的錯誤 | 500 | 純文字 `Internal Server Error`，原因寫在 `listenmiao.log` |

    同一個 422 可能是兩種格式其中之一：欄位本身不合格式時 `detail` 是陣列，欄位格式正確但內容不被接受（例如熱詞太長）時 `detail` 是字串。

    ## 拒絕來自其他網站的寫入

    瀏覽器從其他網站送來的 `POST`、`PUT`、`PATCH`、`DELETE`（請求標頭 `Sec-Fetch-Site` 是 `cross-site` 或 `same-site`）一律回 403。curl、Python 等不帶這個標頭的程式不受影響。

    ## 只接受允許的主機名稱

    請求標頭 `Host` 的主機名稱不在服務 `.env` 的 `ASR_ALLOWED_HOSTS` 裡時，任何路徑、任何方法都回 400，`detail` 說明要把哪個名稱加進清單。比對時不看埠號、不分大小寫。

    ## 上傳上限

    - `POST /api/jobs` 與 `POST /api/jobs/{job_id}/renders` 必須帶 `Content-Length`，沒有就回 411。
    - 不需要權杖的 `POST /api/session` 也必須帶 `Content-Length`，超過 4 KB 時還沒讀內容就回 413。
    - `Content-Length` 超過 `ASR_MAX_UPLOAD_MB` 再加 64 KiB（multipart 的欄位與分隔線）時，還沒讀檔就回 413；檔案本身超過 `ASR_MAX_UPLOAD_MB` 也回 413。
    - 音訊長度超過 `ASR_MAX_AUDIO_SECONDS` 回 422；排隊中的工作達到 `ASR_MAX_QUEUE` 回 503。

    目前的上限值可從 `GET /api/config` 的 `max_upload_mb`、`max_audio_seconds` 取得。

    ## 保留期限

    - 辨識成功的結果寫在 `ASR_DATA_DIR/results`，服務重新啟動後仍在；結束超過 `ASR_JOB_TTL_SECONDS` 秒的工作會被清掉，之後查詢回 404。
    - 排隊中或處理中的工作、失敗與取消的工作只在記憶體裡，服務重新啟動就沒有了。
    - 燒好字幕的影片保留同樣的秒數，但服務重新啟動時會清掉。

    ## 每個回應都有的標頭

    | 標頭 | 值 |
    | --- | --- |
    | `Content-Security-Policy` | `default-src 'self'`，只允許同源的程式、樣式與連線 |
    | `X-Content-Type-Options` | `nosniff` |
    | `Referrer-Policy` | `no-referrer` |
    | `Permissions-Policy` | `microphone=(self), camera=(), geolocation=()` |
    | `Cache-Control` | `no-cache`（回應本身沒有指定時） |

    ## 時間與數字

    秒數都是浮點數；`created_at`、`finished_at` 等時間是 Unix 時間（秒）。進度是 0 到 1 的小數。
externalDocs:
  description: API 說明（中文）
  url: https://github.com/Scorpio-meow/ListenMiao/blob/main/docs/api.md
servers:
  - name: local
    url: http://{host}:{port}
    description: 執行中的 ListenMiao 服務，位址與連接埠來自 `.env` 的 `ASR_HOST`、`ASR_PORT`（Docker 版是 `ASR_PUBLISH_ADDRESS`、`ASR_PUBLISH_PORT`）。
    variables:
      host:
        default: 127.0.0.1
        description: 服務的主機名稱或 IP
      port:
        default: "7860"
        description: 服務的連接埠
security:
  - {}
  - accessToken: []
  - session: []
tags:
  - name: service
    summary: 服務
    description: 服務狀態、設定與網頁錯誤回報。
    kind: nav
  - name: hardware
    summary: 硬體與調校
    description: 自動調校實測推論裝置與權重格式，並可改用其他實測過的設定。
    kind: nav
  - name: glossary
    summary: 詞彙表與熱詞
    description: 熱詞讓模型更容易辨識出人名與專有名詞；取代規則在辨識後把固定的錯字改掉。
    kind: nav
  - name: jobs
    summary: 辨識工作
    description: 建立、查詢與取消辨識工作。工作依序處理，一次一個。
    kind: nav
  - name: transcript
    summary: 編輯字幕
    parent: jobs
    description: |
      修改已完成的辨識結果。每次修改都會讓 `result.revision` 加一並寫回磁碟；整份取代時要帶上目前的 `revision`，避免覆蓋別的分頁做的修改。
    kind: nav
  - name: exports
    summary: 匯出
    parent: jobs
    description: 把辨識結果下載成文字、字幕或 Word 檔。
    kind: nav
  - name: renders
    summary: 燒錄字幕
    parent: jobs
    description: 把字幕燒進原始影片，輸出 H.264／AAC 的 MP4。一次燒一支，其他排隊。
    kind: nav
  - name: voices
    summary: 語者庫
    description: |
      記住說話者的聲音，之後的辨識結果遇到相似的聲音會自動帶入名字。只有提供分辨說話者（`models.json` 的 `speakers` 不是 `null`）時才能使用；否則這一組端點都回 404。
    kind: nav

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: 服務是否正常運作
      description: 只要網頁服務在跑就回 200，不代表模型已經載入；模型與硬體狀態請看 `GET /api/config`。
      security: []
      responses:
        "200":
          summary: 服務正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  dataValue:
                    status: ok

  /api/session:
    post:
      operationId: createSession
      tags: [service]
      summary: 用存取權杖登入網頁
      description: |
        只在 `.env` 設定了 `ASR_ACCESS_TOKEN` 時使用。權杖正確就設定 `breeze_asr_session` cookie，之後同一個瀏覽器的請求不必再帶權杖。cookie 是 `HttpOnly`、`SameSite=Strict`、保留 400 天，網頁以 HTTPS 開啟時再加上 `Secure`；值由權杖導出，不是權杖本身，改掉權杖後所有瀏覽器都要重新登入。

        權杖前後的空白與換行會先去掉。一分鐘內錯了 10 次之後，這一分鐘內的登入一律回 429，連正確的權杖也一樣。

        這個端點不需要權杖，所以請求必須帶 `Content-Length`（缺少回 411），超過 4 KB 時還沒讀內容就回 413，不會把整個請求讀進記憶體。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionLogin"
            examples:
              login:
                dataValue:
                  token: k3Jq9V_x2mL8tR4wZ0pN6sYb
      responses:
        "204":
          summary: 已登入
          headers:
            Set-Cookie:
              description: 網頁用的登入狀態
              schema:
                type: string
              example: breeze_asr_session=3f1c…; HttpOnly; Max-Age=34560000; Path=/; SameSite=strict; Secure
        "401":
          summary: 權杖不正確
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrong:
                  dataValue:
                    detail: 存取權杖不正確
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          summary: 服務沒有設定存取權杖
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                off:
                  dataValue:
                    detail: 這個服務沒有設定存取權杖
        "411":
          $ref: "#/components/responses/LengthRequired"
        "413":
          summary: 登入資料超過 4 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooLarge:
                  dataValue:
                    detail: 登入資料太大
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          summary: 錯誤次數太多
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                locked:
                  dataValue:
                    detail: 嘗試太多次，請一分鐘後再試

  /api/client-errors:
    post:
      operationId: reportClientError
      tags: [service]
      summary: 網頁回報錯誤到日誌
      description: |
        網頁遇到未處理的 JavaScript 錯誤或上傳時連線中斷，會用這個端點寫進 `listenmiao.log`。每個欄位的換行與控制字元會併成一行空白，只記前 1000 個字。

        整個服務每分鐘最多記 30 則，超過的回 429 且不記錄；之後第一則被記錄時，會另外記一行說明有幾則被略過。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
            examples:
              scriptError:
                summary: 未處理的例外
                dataValue:
                  kind: error
                  message: x is not defined
                  source: app.js:10:5
      responses:
        "204":
          summary: 已寫入日誌
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          summary: 超過每分鐘 30 則的上限
          description: 沒有內容。這則錯誤沒有被記錄。

  /api/config:
    get:
      operationId: getConfig
      tags: [service]
      summary: 模型、硬體與各項功能的狀態
      description: |
        網頁開啟時與等待模型、調校期間會反覆讀取這個端點。包含：

        - 每個模型的準備狀態與實測速度
        - 硬體調校的狀態與實測紀錄
        - 分辨說話者、自動標點、監看資料夾是否提供及其狀態（沒有提供時是 `null`）
        - 可匯出的格式與各項上限
      responses:
        "200":
          summary: 目前的設定與狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
              examples:
                ready:
                  $ref: "#/components/examples/ConfigReady"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/update:
    get:
      operationId: checkUpdate
      tags: [service]
      summary: 檢查有沒有新版
      description: |
        服務這時才連到 GitHub 查詢最新的正式版；平常不會連線。`how` 不是 `null` 時，不能從網頁更新，照它說的做法更新。
      responses:
        "200":
          summary: 目前與最新的版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheck"
              examples:
                newer:
                  dataValue:
                    current: 0.6.0
                    latest: 0.6.1
                    newer: true
                    published: "2026-12-01"
                    url: https://github.com/Scorpio-meow/ListenMiao/releases/tag/v0.6.1
                    how: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          summary: 連不上 GitHub，或 GitHub 回應錯誤
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: startUpdate
      tags: [service]
      summary: 關閉服務並更新到最新版
      description: |
        記下更新要求後關閉服務；啟動腳本接著下載最新版的 zip、核對 SHA-256、換上新版的檔案並重裝套件，再重新啟動服務。`.env`、資料目錄與改過的檔案都會保留。只有用桌面捷徑或 `scripts/start` 啟動、以 Releases 的 zip 安裝時可以使用。
      responses:
        "202":
          summary: 服務即將關閉並更新
          content:
            application/json:
              schema:
                type: object
                required: [restarting]
                properties:
                  restarting:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "409":
          summary: 不能從網頁更新，或還有辨識、燒錄工作在進行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                busy:
                  dataValue:
                    detail: 還有辨識或燒錄工作在進行，請等全部完成後再更新

  /api/hardware/retune:
    post:
      operationId: retuneHardware
      tags: [hardware]
      summary: 重新調校
      description: |
        刪除硬體設定檔並重新啟動推論子行程：重新偵測硬體，把預設模型轉成要實測的權重格式並逐一實測（Core i7-9700 上約 7–9 分鐘，Core Ultra 7 155U 上約 7 分鐘），期間無法辨識。進度從 `GET /api/config` 的 `hardware` 讀取。
      responses:
        "202":
          summary: 已開始重新調校
          description: '回傳新的調校狀態，也就是 `{"state": "tuning", "step": "重新啟動推論行程"}`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hardware"
              examples:
                tuning:
                  dataValue:
                    state: tuning
                    step: 重新啟動推論行程
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "409":
          summary: 還有工作在排隊或處理中，或正在調校中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                busy:
                  dataValue:
                    detail: 還有工作在排隊或處理中，請等全部完成後再重新調校
                tuning:
                  dataValue:
                    detail: 正在調校中

  /api/hardware/settings:
    post:
      operationId: chooseHardware
      tags: [hardware]
      summary: 改用另一個實測過的設定
      description: |
        改用實測紀錄裡的另一個設定。`label` 取自 `GET /api/config` 的 `hardware.tuning.candidates[].label`，只能選實測時跑得起來的項目（`status` 是 `ok` 或 `rejected`，錯誤率不合格的也可以選）。

        服務會依該項目量到的記憶體重新決定可以同時常駐幾個模型，寫回硬體設定檔，再重新啟動推論子行程。該權重格式已被調校清掉時，第一次使用會重新轉換。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardwareChoice"
            examples:
              igpu:
                dataValue:
                  label: Intel(R) Graphics (iGPU)（OpenVINO GPU・int8）
      responses:
        "202":
          summary: 已改用這個設定，推論子行程重新啟動中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hardware"
              examples:
                starting:
                  dataValue:
                    state: starting
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "409":
          summary: 還有工作在排隊或處理中，或推論設定還沒就緒
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                busy:
                  dataValue:
                    detail: 還有工作在排隊或處理中，請等全部完成後再切換
                notReady:
                  dataValue:
                    detail: 推論設定還沒就緒，請稍後再試
        "422":
          summary: 設定檔沒有實測紀錄、找不到這個設定，或它實測時無法執行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                unknown:
                  dataValue:
                    detail: 實測紀錄裡沒有這個設定
                failed:
                  dataValue:
                    detail: 這個設定實測時無法執行，不能選用
                handWritten:
                  dataValue:
                    detail: 手寫的硬體設定檔沒有實測紀錄，請直接修改設定檔

  /api/glossary:
    get:
      operationId: getGlossary
      tags: [glossary]
      summary: 讀取詞彙表
      description: 還沒存過時熱詞是空字串、取代規則是空陣列。
      responses:
        "200":
          summary: 目前的詞彙表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Glossary"
              examples:
                saved:
                  $ref: "#/components/examples/Glossary"
                empty:
                  summary: 還沒存過
                  dataValue:
                    hotwords: ""
                    replacements: []
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveGlossary
      tags: [glossary]
      summary: 儲存詞彙表
      description: |
        整份取代詞彙表。熱詞與每條規則的連續空白、換行會先合併成一個空格再檢查長度；`find` 與 `replace` 相同的規則會略過。

        取代規則會套用到之後完成的辨識結果（在加標點之前），依清單順序逐條取代；某段字幕取代後變成空白就會被刪掉。已有的結果不受影響。熱詞是網頁建立工作時預先帶入的值，監看資料夾也會用它。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Glossary"
            examples:
              names:
                $ref: "#/components/examples/Glossary"
      responses:
        "200":
          summary: 儲存後的詞彙表
          description: 空白已合併，與 `find` 相同的規則已移除。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Glossary"
              examples:
                saved:
                  $ref: "#/components/examples/Glossary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "422":
          summary: 格式不對或超過上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                fields:
                  dataValue:
                    detail: 詞彙表必須剛好有 hotwords 與 replacements 兩個欄位
                emptyFind:
                  dataValue:
                    detail: 第 2 條的原文不可空白
                tooLong:
                  dataValue:
                    detail: 熱詞最多 1000 個字

  /api/hotwords/count:
    post:
      operationId: countHotwords
      tags: [glossary]
      summary: 計算熱詞的 token 數
      description: |
        用模型的 tokenizer 計算熱詞會佔用多少 token，以及這個模型能接受的上限（`max_target_positions` 的一半減一）。第一次查詢某個模型時會從 Hugging Face 讀取它的 tokenizer。

        超過上限不會回錯誤，由呼叫端比較 `tokens` 與 `limit`；用超過上限的熱詞建立工作才會回 422。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotwordsCountRequest"
            examples:
              attendees:
                dataValue:
                  model: MediaTek-Research/Breeze-ASR-25
                  text: 與會者有王小明、陳美玲。
      responses:
        "200":
          summary: token 數與上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotwordsCount"
              examples:
                attendees:
                  dataValue:
                    tokens: 15
                    limit: 223
        "400":
          summary: 不支援的模型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownModel:
                  dataValue:
                    detail: 不支援的模型：openai/whisper-large-v3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "422":
          summary: 熱詞超過 1000 字，或這個模型轉呼叫外部服務、不支援熱詞
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                tooLong:
                  dataValue:
                    detail: 熱詞最多 1000 個字
                remote:
                  dataValue:
                    detail: 外部辨識服務 轉呼叫外部服務，不支援熱詞

  /api/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: 列出保留中的工作
      description: 包含排隊中、處理中與還沒過期的已結束工作，最新建立的在前。只有摘要，完整結果用 `GET /api/jobs/{job_id}`。
      responses:
        "200":
          summary: 工作清單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
              examples:
                two:
                  dataValue:
                    jobs:
                      - id: q3Zt0k8yJmQe2LxW
                        model: MediaTek-Research/Breeze-ASR-25
                        filename: 週會.m4a
                        audio_seconds: 1824.5
                        status: running
                        stage: transcribing
                        created_at: 1793583123.41
                        finished_at: null
                        segments: null
                      - id: Hn4cV7pLs0aR1uYb
                        model: MediaTek-Research/Breeze-ASR-25
                        filename: lecture.mp4
                        audio_seconds: 29.11
                        status: succeeded
                        stage: null
                        created_at: 1793579011.02
                        finished_at: 1793579030.77
                        segments: 7
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createJob
      tags: [jobs]
      summary: 建立辨識工作
      description: |
        上傳音訊或影片檔並排入佇列。檔案先在服務端用 ffmpeg 轉成 16 kHz 單聲道，轉不出音訊、長度超過上限或熱詞太長時立即回錯誤，不會排入佇列。

        回應除了工作狀態，還多一個 `waveform`：把整段音訊等分成 4000 格、每格的峰值，網頁在瀏覽器無法自行解碼時用它畫波形。

        必填欄位缺少時先回 422（`detail` 是陣列）；接著依序檢查 `punctuation`、`model`、`speakers`、自動標點是否提供、熱詞長度與 token 數，再存檔與解碼。
      parameters:
        - $ref: "#/components/parameters/ContentLength"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateJobForm"
            encoding:
              file:
                contentType: audio/*, video/*, application/octet-stream
            examples:
              meeting:
                summary: 自動判斷說話者人數並加標點
                serializedValue: |
                  --boundary
                  Content-Disposition: form-data; name="model"

                  MediaTek-Research/Breeze-ASR-25
                  --boundary
                  Content-Disposition: form-data; name="speakers"

                  auto
                  --boundary
                  Content-Disposition: form-data; name="punctuation"

                  on
                  --boundary
                  Content-Disposition: form-data; name="hotwords"

                  與會者有王小明、陳美玲，會中提到 Kubernetes。
                  --boundary
                  Content-Disposition: form-data; name="file"; filename="meeting.m4a"
                  Content-Type: audio/mp4

                  （檔案內容）
                  --boundary--
      responses:
        "202":
          summary: 已排入佇列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedJob"
              examples:
                queued:
                  summary: 前面還有一個工作在處理
                  description: "`waveform` 實際有 4000 個數字，這裡只列出開頭幾個。"
                  dataValue:
                    id: q3Zt0k8yJmQe2LxW
                    model: MediaTek-Research/Breeze-ASR-25
                    filename: meeting.m4a
                    audio_seconds: 1824.5
                    status: queued
                    stage: null
                    speakers_mode: auto
                    created_at: 1793583123.41
                    finished_at: null
                    error: null
                    queue_position: 1
                    jobs_ahead: 1
                    punctuation: true
                    hotwords: 與會者有王小明、陳美玲，會中提到 Kubernetes。
                    waveform: [0.0, 0.012, 0.348, 0.512, 1.0, 0.761]
          links:
            getJob:
              operationId: getJob
              parameters:
                job_id: $response.body#/id
              description: 查詢這個工作的狀態與結果
            cancelJob:
              operationId: cancelJob
              parameters:
                job_id: $response.body#/id
              description: 取消這個工作
        "400":
          summary: 不支援的模型，選項不合法，或這個服務沒有提供要求的功能
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownModel:
                  dataValue:
                    detail: 不支援的模型：openai/whisper-large-v3
                speakers:
                  dataValue:
                    detail: speakers 只能是 off、auto 或 2–8 的人數
                punctuation:
                  dataValue:
                    detail: punctuation 只能是 on 或 off
                noDiarization:
                  dataValue:
                    detail: 這個服務沒有提供分辨說話者，speakers 只能是 off
                noPunctuation:
                  dataValue:
                    detail: 這個服務沒有提供自動標點，punctuation 只能是 off
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "411":
          $ref: "#/components/responses/LengthRequired"
        "413":
          $ref: "#/components/responses/UploadTooLarge"
        "422":
          summary: 欄位缺少、無法解碼、音訊太長、熱詞太長，或外部服務模型給了熱詞
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                noAudio:
                  dataValue:
                    detail: 檔案裡沒有可辨識的音訊
                cannotDecode:
                  dataValue:
                    detail: '無法解析這個檔案的音訊：Error opening input files: Invalid data found when processing input'
                tooLong:
                  dataValue:
                    detail: 音訊長度超過上限 10800 秒
                hotwordsLength:
                  dataValue:
                    detail: 熱詞最多 1000 個字
                hotwordsTokens:
                  dataValue:
                    detail: 熱詞太長：240 個 token，Breeze ASR 25 最多 223 個
                missingField:
                  dataValue:
                    detail:
                      - type: missing
                        loc: [body, file]
                        msg: Field required
                        input: null
        "503":
          summary: 排隊的工作已達上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                full:
                  dataValue:
                    detail: 目前排隊中的工作已達上限 20 筆，請稍後再試

  /api/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJob
      tags: [jobs]
      summary: 查詢工作狀態與結果
      description: |
        依 `status` 與 `stage` 會多出不同的欄位：

        | 時機 | 多出的欄位 |
        | --- | --- |
        | `status` 是 `queued` | `queue_position`、`jobs_ahead` |
        | `stage` 是 `transcribing` 或 `diarizing` | `stage_elapsed_seconds` |
        | `stage` 是 `transcribing` | `progress`、`estimated_seconds`（無法得知時是 `null`） |
        | 正在分辨說話者 | `speakers_progress` |
        | `status` 是 `succeeded` | `result` |

        辨識與分辨說話者同時進行：`stage` 是 `transcribing` 時可能已經有 `speakers_progress`。
      responses:
        "200":
          summary: 工作狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                transcribing:
                  $ref: "#/components/examples/JobTranscribing"
                succeeded:
                  $ref: "#/components/examples/JobSucceeded"
                failed:
                  summary: 失敗
                  dataValue:
                    id: q3Zt0k8yJmQe2LxW
                    model: MediaTek-Research/Breeze-ASR-25
                    filename: 週會.m4a
                    audio_seconds: 1824.5
                    status: failed
                    stage: null
                    speakers_mode: "off"
                    created_at: 1793583123.41
                    finished_at: 1793583188.02
                    error: 推論行程意外結束（可能是驅動程式錯誤或記憶體不足），已自動重新啟動，請再送出一次
                    punctuation: false
                    hotwords: ""
          links:
            exportJob:
              operationId: exportJob
              parameters:
                job_id: $request.path.job_id
              description: 成功後下載結果
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/JobNotFound"
    delete:
      operationId: cancelJob
      tags: [jobs]
      summary: 取消工作
      description: 排隊中的工作立即變成 `cancelled`。處理中的工作會結束推論子行程（與分辨說話者、自動標點的子行程）再重新啟動，`status` 稍後才變成 `cancelled`，回應裡仍是 `running`。
      responses:
        "200":
          summary: 已取消或取消中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                transcribing:
                  $ref: "#/components/examples/JobTranscribing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          summary: 工作已經結束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                done:
                  dataValue:
                    detail: 這個工作已經結束，無法取消

  /api/jobs/{job_id}/transcript:
    parameters:
      - $ref: "#/components/parameters/JobId"
    put:
      operationId: replaceTranscript
      tags: [transcript]
      summary: 用整份字幕取代結果
      description: |
        網頁的改文字、改時間、分割、合併、刪除、改說話者、合併說話者、尋找取代與復原都是送這個請求（只有在「說話者」面板改名字用 `PATCH …/speakers/{speaker_id}`）。

        - `revision` 必須等於目前 `result.revision`，否則回 409。
        - 字幕依開始時間排序；每段的結束時間不可早於開始時間，而且在 0 到音訊長度之間（容許 0.01 秒誤差）；時間四捨五入到 0.01 秒。最多 20000 段。
        - 每段文字的連續空白與換行會合併成一個空格，不可空白，最多 500 字。
        - 沒有分辨說話者的結果，`speakers` 與每段的 `speaker` 都必須是 `null`；有分辨說話者時，`speakers` 是陣列，每段的 `speaker` 都要在裡面。
        - 說話者 `id` 是 S 加 1–4 位數字（例如 `S5`），可以新增；新增的人沒有聲紋，不能記住聲音。新的編號不要用 `voiceprint_speakers` 裡的編號，否則會沿用那位說話者原本的聲紋。
        - 沒有任何字幕的說話者會被移除（合併說話者就是把字幕都改給另一人）；每人的 `seconds` 依字幕重新計算，送來的值不會用到。
        - `voice_id` 是語者庫裡的人或 `null`；語者庫裡已經沒有的人（例如剛刪除）存成 `null`。`voice_id` 是 `null` 時 `similarity` 一律存成 `null`。
        - 全文 `text` 會改成各段文字以換行相接。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptUpdate"
            examples:
              rename:
                summary: 改說話者名字與一段文字
                dataValue:
                  revision: 3
                  segments:
                    - start: 0.0
                      end: 4.24
                      text: 那顯然這樣子的 attention 是有問題的
                      speaker: S1
                    - start: 4.24
                      end: 9.8
                      text: 所以我們要換一個方法來做
                      speaker: S2
                  speakers:
                    - id: S1
                      name: 王小明
                      voice_id: null
                      similarity: null
                    - id: S2
                      name: 陳美玲
                      voice_id: Xk2pQ9rT_aE
                      similarity: 0.82
              noSpeakers:
                summary: 沒有分辨說話者的結果
                dataValue:
                  revision: 0
                  segments:
                    - start: 0.0
                      end: 4.24
                      text: 那顯然這樣子的 attention 是有問題的
                      speaker: null
                  speakers: null
      responses:
        "200":
          summary: 更新後的工作狀態
          description: "`result.revision` 加一。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                succeeded:
                  $ref: "#/components/examples/JobSucceeded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/ResultNotFound"
        "409":
          summary: "`revision` 不符"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                conflict:
                  dataValue:
                    detail: 這份字幕已經在別的地方改過，請重新載入後再編輯
        "422":
          summary: 內容不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                order:
                  dataValue:
                    detail: 第 3 段的開始時間早於上一段，字幕必須依開始時間排序
                range:
                  dataValue:
                    detail: 第 7 段的時間超出音訊範圍（0–29.11 秒）
                speaker:
                  dataValue:
                    detail: 第 2 段的說話者 'S9' 不在說話者清單裡
                speakerId:
                  dataValue:
                    detail: 說話者編號必須是 S 加數字，例如 S1，不能是 'A'
                speakersNull:
                  dataValue:
                    detail: 這份結果沒有分辨說話者，speakers 必須是 null
                emptyText:
                  dataValue:
                    detail: 第 4 段文字不可空白
                tooMany:
                  dataValue:
                    detail: 字幕最多 20000 段

  /api/jobs/{job_id}/speakers/{speaker_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/SpeakerId"
    patch:
      operationId: renameSpeaker
      tags: [transcript]
      summary: 替說話者改名
      description: |
        名字的連續空白與換行會合併成一個空格，不可空白，最多 40 字。

        名字有變時，這位說話者與語者庫的對應（`voice_id`、`similarity`）會清成 `null`，`result.revision` 加一；名字沒變則什麼都不改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerNameUpdate"
            examples:
              name:
                dataValue:
                  name: 王小明
      responses:
        "200":
          summary: 更新後的工作狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                succeeded:
                  $ref: "#/components/examples/JobSucceeded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          summary: 找不到工作、還沒有辨識結果，或沒有這位說話者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                job:
                  dataValue:
                    detail: 找不到這個工作的辨識結果，可能已過期
                speaker:
                  dataValue:
                    detail: 這個工作沒有說話者 S9
        "422":
          summary: 名字空白或超過 40 字
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                empty:
                  dataValue:
                    detail: 名字不可空白
                tooLong:
                  dataValue:
                    detail: 名字最多 40 個字

  /api/jobs/{job_id}/segments/{index}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/SegmentIndex"
    patch:
      operationId: editSegment
      tags: [transcript]
      summary: 修改一段字幕的文字
      description: |
        修改第 `index` 段（從 0 起算）的文字。連續空白與換行會合併成一個空格，不可空白，最多 500 字。文字有變時 `result.revision` 加一，全文 `text` 一起更新。

        時間不能用這個端點改；要改時間、分割或合併，用 `PUT /api/jobs/{job_id}/transcript`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentTextUpdate"
            examples:
              fix:
                dataValue:
                  text: 那顯然這樣子的 attention 是有問題的
      responses:
        "200":
          summary: 更新後的工作狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                succeeded:
                  $ref: "#/components/examples/JobSucceeded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          summary: 找不到工作、還沒有辨識結果，或沒有這一段
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                job:
                  dataValue:
                    detail: 找不到這個工作的辨識結果，可能已過期
                segment:
                  dataValue:
                    detail: 這個工作沒有第 120 段字幕
        "422":
          summary: "`index` 不是整數，或文字空白、超過 500 字"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                empty:
                  dataValue:
                    detail: 字幕文字不可空白
                tooLong:
                  dataValue:
                    detail: 字幕文字最多 500 個字

  /api/jobs/{job_id}/export/{fmt}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/ExportFormat"
    get:
      operationId: exportJob
      tags: [exports]
      summary: 下載結果
      description: |
        以附件下載目前已儲存的字幕（包含所有修改）。檔名沿用上傳的檔名、換成對應的副檔名。

        | `fmt` | 內容 |
        | --- | --- |
        | `txt` | 純文字；有說話者時同一人連續說的話併成一段，前面加「名字：」 |
        | `srt`、`vtt` | 字幕；說話者以「名字：」或 VTT 的 `<v 名字>` 標示 |
        | `ass` | 字幕，1920×1080，字型取自 `ASR_SUBTITLE_FONT`；說話者名字放在 `Name` 欄位與文字前 |
        | `md` | 逐字稿：檔名、長度、說話者清單，內文是 `[時:分:秒] **說話者**：…`，同一人連續的話併成一段、每段最長約 2 分鐘 |
        | `docx` | Word 逐字稿，內容同 `md` |
        | `json` | 每段的起訖秒數、文字、說話者 |
      responses:
        "200":
          summary: 檔案內容
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
          content:
            "text/plain; charset=utf-8":
              schema:
                type: string
              examples:
                txt:
                  serializedValue: |
                    王小明：那顯然這樣子的 attention 是有問題的

                    陳美玲：所以我們要換一個方法來做
            "application/x-subrip; charset=utf-8":
              schema:
                type: string
              examples:
                srt:
                  serializedValue: |
                    1
                    00:00:00,000 --> 00:00:04,240
                    王小明：那顯然這樣子的 attention 是有問題的

                    2
                    00:00:04,240 --> 00:00:09,800
                    陳美玲：所以我們要換一個方法來做
            "text/vtt; charset=utf-8":
              schema:
                type: string
              examples:
                vtt:
                  serializedValue: |
                    WEBVTT

                    00:00:00.000 --> 00:00:04.240
                    <v 王小明>那顯然這樣子的 attention 是有問題的

                    00:00:04.240 --> 00:00:09.800
                    <v 陳美玲>所以我們要換一個方法來做
            "text/x-ssa; charset=utf-8":
              schema:
                type: string
            "text/markdown; charset=utf-8":
              schema:
                type: string
              examples:
                md:
                  serializedValue: |
                    # lecture.mp4

                    - 長度：00:00:29
                    - 說話者：王小明（00:00:04）、陳美玲（00:00:05）

                    [00:00:00] **王小明**：那顯然這樣子的 attention 是有問題的

                    [00:00:04] **陳美玲**：所以我們要換一個方法來做
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
            "application/json; charset=utf-8":
              schema:
                $ref: "#/components/schemas/ExportJson"
              examples:
                json:
                  dataValue:
                    text: |-
                      那顯然這樣子的 attention 是有問題的
                      所以我們要換一個方法來做
                    segments:
                      - start: 0.0
                        end: 4.24
                        text: 那顯然這樣子的 attention 是有問題的
                        speaker: S1
                        speaker_name: 王小明
                      - start: 4.24
                        end: 9.8
                        text: 所以我們要換一個方法來做
                        speaker: S2
                        speaker_name: 陳美玲
                    audio_seconds: 29.11
                    processing_seconds: 18.4
                    speakers:
                      - id: S1
                        name: 王小明
                        seconds: 4.2
                      - id: S2
                        name: 陳美玲
                        seconds: 5.6
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          summary: 找不到工作，或不支援的格式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                job:
                  dataValue:
                    detail: 找不到這個工作，可能已過期
                format:
                  dataValue:
                    detail: 不支援的格式：pdf
        "409":
          $ref: "#/components/responses/NoResult"

  /api/jobs/{job_id}/renders:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: createRender
      tags: [renders]
      summary: 把字幕燒進原始影片
      description: |
        上傳這份字幕的原始影片，服務把目前已儲存的字幕（樣式同 ASS 匯出）燒進畫面，輸出 H.264／AAC 的 MP4。影片長度必須和辨識時的音訊相差 2 秒以內。

        一次燒一支，其他排隊；進度用 `GET /api/renders/{render_id}` 查詢。
      parameters:
        - $ref: "#/components/parameters/ContentLength"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateRenderForm"
            encoding:
              file:
                contentType: video/*, application/octet-stream
      responses:
        "202":
          summary: 已排入燒錄佇列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
              examples:
                queued:
                  dataValue:
                    id: b8Wm2TqZ0rKc4NvE
                    job_id: Hn4cV7pLs0aR1uYb
                    status: queued
                    progress: 0.0
                    error: null
                    filename: lecture-字幕.mp4
                    created_at: 1793579120.55
                    finished_at: null
          links:
            getRender:
              operationId: getRender
              parameters:
                render_id: $response.body#/id
              description: 查詢燒錄進度
            cancelRender:
              operationId: cancelRender
              parameters:
                render_id: $response.body#/id
              description: 取消燒錄
            downloadRender:
              operationId: downloadRender
              parameters:
                render_id: $response.body#/id
              description: 完成後下載影片
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          $ref: "#/components/responses/NoResult"
        "411":
          $ref: "#/components/responses/LengthRequired"
        "413":
          $ref: "#/components/responses/UploadTooLarge"
        "422":
          summary: 欄位缺少，檔案沒有影像、讀不到長度，或長度不符
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                noVideo:
                  dataValue:
                    detail: 這個檔案沒有影像，請選擇影片檔
                noDuration:
                  dataValue:
                    detail: 無法讀取這個影片的長度
                mismatch:
                  dataValue:
                    detail: 影片長度 1830.2 秒和這份字幕的 1824.5 秒不符，請選擇原始影片
        "503":
          summary: 排隊的燒錄工作已達上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                full:
                  dataValue:
                    detail: 排隊中的燒錄工作已達上限 20 筆，請稍後再試

  /api/renders/{render_id}:
    parameters:
      - $ref: "#/components/parameters/RenderId"
    get:
      operationId: getRender
      tags: [renders]
      summary: 查詢燒錄進度
      description: 燒好的影片和辨識結果一樣保留 `ASR_JOB_TTL_SECONDS` 秒；服務重新啟動時會清掉。
      responses:
        "200":
          summary: 燒錄狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
              examples:
                running:
                  dataValue:
                    id: b8Wm2TqZ0rKc4NvE
                    job_id: Hn4cV7pLs0aR1uYb
                    status: running
                    progress: 0.415
                    error: null
                    filename: lecture-字幕.mp4
                    created_at: 1793579120.55
                    finished_at: null
                failed:
                  dataValue:
                    id: b8Wm2TqZ0rKc4NvE
                    job_id: Hn4cV7pLs0aR1uYb
                    status: failed
                    progress: 0.12
                    error: 燒錄字幕失敗：Error opening output files：No space left on device
                    filename: lecture-字幕.mp4
                    created_at: 1793579120.55
                    finished_at: 1793579133.9
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RenderNotFound"
    delete:
      operationId: cancelRender
      tags: [renders]
      summary: 取消燒錄
      description: 排隊中的立即變成 `cancelled`；燒錄中的會先變成 `cancelling`，ffmpeg 結束後才變成 `cancelled`。
      responses:
        "200":
          summary: 已取消或取消中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/RenderNotFound"
        "409":
          summary: 燒錄已經結束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                done:
                  dataValue:
                    detail: 這個燒錄工作已經結束，無法取消

  /api/renders/{render_id}/file:
    parameters:
      - $ref: "#/components/parameters/RenderId"
    get:
      operationId: downloadRender
      tags: [renders]
      summary: 下載燒好字幕的影片
      description: 以附件下載，檔名是「原檔名-字幕.mp4」。支援 `Range` 請求，可以續傳或直接在播放器裡拖曳。
      parameters:
        - name: Range
          in: header
          required: false
          description: 只取影片的一部分，例如 `bytes=0-1048575`。
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          summary: 完整影片
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
          content:
            video/mp4:
              schema:
                contentMediaType: video/mp4
        "206":
          summary: 影片的一部分
          headers:
            Content-Range:
              description: 這次回傳的位元組範圍與檔案總大小
              schema:
                type: string
              example: bytes 0-1048575/52428800
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            video/mp4:
              schema:
                contentMediaType: video/mp4
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RenderNotFound"
        "409":
          summary: 燒錄還沒完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notDone:
                  dataValue:
                    detail: 燒錄還沒有完成
        "416":
          summary: "`Range` 超出檔案大小"

  /api/voices:
    get:
      operationId: listVoices
      tags: [voices]
      summary: 語者庫清單
      description: 依加入的先後排列，不含聲紋本身。
      responses:
        "200":
          summary: 語者庫裡的人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceList"
              examples:
                voices:
                  $ref: "#/components/examples/VoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/SpeakersUnavailable"
    post:
      operationId: rememberVoice
      tags: [voices]
      summary: 記住說話者的聲音
      description: |
        把某個結果裡的說話者，以目前的名字記進語者庫；語者庫已有同名的人時累加聲紋（每人最多保留最近的 128 個聲紋向量）。之後辨識遇到相似的聲音（相似度達 `models.json` 的 `speakers.match_threshold`）會自動帶入這個名字。

        說話者必須先改掉預設名字（「說話者 1」這類），而且要有聲紋（見 `result.voiceprint_speakers`；手動新增的說話者沒有）。成功後這位說話者的 `voice_id` 會指向語者庫的這個人，`result.revision` 加一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RememberVoiceRequest"
            examples:
              s1:
                dataValue:
                  job_id: Hn4cV7pLs0aR1uYb
                  speaker_id: S1
      responses:
        "201":
          summary: 已記住
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RememberVoiceResult"
          links:
            forgetVoice:
              operationId: forgetVoice
              parameters:
                voice_id: $response.body#/voice/id
              description: 從語者庫刪除這個人
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          summary: 沒有提供分辨說話者、找不到工作或說話者，或這位說話者沒有聲紋
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unavailable:
                  dataValue:
                    detail: 這個服務沒有提供分辨說話者
                job:
                  dataValue:
                    detail: 找不到這個工作的辨識結果，可能已過期
                speaker:
                  dataValue:
                    detail: 這個工作沒有說話者 S9
                noVoiceprint:
                  dataValue:
                    detail: 這位說話者沒有聲紋（手動新增的說話者，或改版前產生的結果），無法記住聲音
        "422":
          summary: 欄位缺少，或說話者還是預設名字
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
              examples:
                defaultName:
                  dataValue:
                    detail: 請先替這位說話者取名，再記住聲音

  /api/voices/{voice_id}:
    parameters:
      - $ref: "#/components/parameters/VoiceId"
    delete:
      operationId: forgetVoice
      tags: [voices]
      summary: 從語者庫刪除
      description: 刪除這個人與他的聲紋。保留中的結果裡對應到他的說話者，`voice_id` 與 `similarity` 會清成 `null`，名字不變；那些結果的 `revision` 也會增加。
      responses:
        "200":
          summary: 刪除後的清單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceList"
              examples:
                voices:
                  $ref: "#/components/examples/VoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          summary: 沒有提供分辨說話者，或語者庫裡沒有這個人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unavailable:
                  dataValue:
                    detail: 這個服務沒有提供分辨說話者
                missing:
                  dataValue:
                    detail: 語者庫裡沒有這個人

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      description: 工作編號，`POST /api/jobs` 回傳的 `id`（16 個字元，URL-safe Base64）。
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
      example: Hn4cV7pLs0aR1uYb
    RenderId:
      name: render_id
      in: path
      required: true
      description: 燒錄工作編號，`POST /api/jobs/{job_id}/renders` 回傳的 `id`。
      schema:
        type: string
      example: b8Wm2TqZ0rKc4NvE
    VoiceId:
      name: voice_id
      in: path
      required: true
      description: 語者庫裡的人的編號（`GET /api/voices` 的 `id`）。
      schema:
        type: string
      example: Xk2pQ9rT_aE
    SpeakerId:
      name: speaker_id
      in: path
      required: true
      description: 說話者編號，`result.speakers[].id`。
      schema:
        type: string
      example: S1
    SegmentIndex:
      name: index
      in: path
      required: true
      description: 第幾段字幕，從 0 起算。負數或超出範圍回 404。
      schema:
        type: integer
      example: 0
    ExportFormat:
      name: fmt
      in: path
      required: true
      description: 匯出格式。不在清單裡的格式回 404。
      schema:
        $ref: "#/components/schemas/ExportFormat"
      example: srt
    ContentLength:
      name: Content-Length
      in: header
      required: true
      description: 整個請求本文的位元組數。缺少時回 411；超過 `ASR_MAX_UPLOAD_MB` 加 64 KiB 時回 413。瀏覽器、curl 上傳檔案時會自動帶上。
      schema:
        type: integer
        minimum: 0

  headers:
    ContentDisposition:
      description: 以附件下載；檔名以 RFC 5987 編碼，支援中文。
      schema:
        type: string
      example: attachment; filename*=UTF-8''lecture.srt
    AcceptRanges:
      description: 支援以位元組為單位的部分下載
      schema:
        type: string
        const: bytes
    ETag:
      description: 檔案版本，依修改時間與大小產生
      schema:
        type: string
    LastModified:
      description: 檔案的修改時間（HTTP 日期）
      schema:
        type: string

  responses:
    Unauthorized:
      summary: 沒有帶正確的存取權杖
      description: 只在 `.env` 設定了 `ASR_ACCESS_TOKEN` 時出現。
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              dataValue:
                detail: 需要存取權杖
    CrossSite:
      summary: 來自其他網站的請求
      description: 瀏覽器帶來的 `Sec-Fetch-Site` 是 `cross-site` 或 `same-site`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            crossSite:
              dataValue:
                detail: 拒絕來自其他網站的請求
    ValidationFailed:
      summary: 欄位缺少或型別錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          examples:
            missing:
              dataValue:
                detail:
                  - type: missing
                    loc: [body, message]
                    msg: Field required
                    input:
                      kind: error
                      source: app.js:10:5
    JobNotFound:
      summary: 找不到工作，或已過期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              dataValue:
                detail: 找不到這個工作，可能已過期
    ResultNotFound:
      summary: 找不到工作，或還沒有辨識結果
      description: 工作不存在、已過期，或還沒成功完成（排隊中、處理中、失敗、取消）都回 404。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              dataValue:
                detail: 找不到這個工作的辨識結果，可能已過期
    NoResult:
      summary: 工作還沒有辨識結果
      description: 工作還在排隊、處理中，或已經失敗、取消。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notYet:
              dataValue:
                detail: 這個工作還沒有辨識結果
    RenderNotFound:
      summary: 找不到燒錄工作，或已過期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              dataValue:
                detail: 找不到這個燒錄工作，可能已過期
    SpeakersUnavailable:
      summary: 這個服務沒有提供分辨說話者
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unavailable:
              dataValue:
                detail: 這個服務沒有提供分辨說話者
    LengthRequired:
      summary: 請求缺少 Content-Length
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              dataValue:
                detail: 請求缺少 Content-Length
    UploadTooLarge:
      summary: 檔案超過 ASR_MAX_UPLOAD_MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tooLarge:
              dataValue:
                detail: 檔案超過上限 2048 MB

