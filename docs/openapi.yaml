  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      description: "`.env` 的 `ASR_ACCESS_TOKEN`，命令列工具、MCP server 與其他程式用這個。"
    session:
      type: apiKey
      in: cookie
      name: breeze_asr_session
      description: "`POST /api/session` 設定的 cookie，網頁用這個。"

  schemas:
    UpdateCheck:
      type: object
      required: [current, latest, newer, published, url, how]
      properties:
        current:
          type: string
          description: 目前的版本
        latest:
          type: string
          description: GitHub 上最新正式版的版本
        newer:
          type: boolean
          description: 最新版是否比目前的版本新
        published:
          type: string
          format: date
          description: 最新版的發布日期
        url:
          type: string
          description: 最新版的 Release 頁面，含更新內容
        how:
          type: [string, "null"]
          description: 不能從網頁更新時的原因與做法（用 git 取得、Docker、不是由啟動腳本啟動）；可以更新時是 `null`
    Error:
      type: object
      description: 服務判斷的錯誤。
      required: [detail]
      properties:
        detail:
          type: string
          description: 錯誤原因（中文）
    ValidationError:
      type: object
      description: 欄位缺少或型別錯誤（由 FastAPI 檢查）。
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    ValidationIssue:
      type: object
      required: [type, loc, msg]
      properties:
        type:
          type: string
          description: 錯誤種類，例如 `missing`、`int_parsing`、`string_type`
        loc:
          type: array
          description: 出錯的位置，例如 `["body", "segments", 0, "start"]`
          items:
            type: [string, integer]
        msg:
          type: string
          description: 英文說明
        input:
          description: 收到的值
        ctx:
          type: object
          description: 補充資訊，例如型別限制
    AnyError:
      description: 422 的兩種格式：欄位格式不對時是 `ValidationError`，內容不被接受時是 `Error`。
      anyOf:
        - $ref: "#/components/schemas/Error"
        - $ref: "#/components/schemas/ValidationError"

    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok

    SessionLogin:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: "`.env` 的 `ASR_ACCESS_TOKEN`"

    ClientErrorReport:
      type: object
      required: [kind, message, source]
      properties:
        kind:
          type: string
          description: 錯誤種類，網頁送 `error`（未處理的例外）、`unhandledrejection`（未處理的 Promise 拒絕）或 `upload`（上傳中斷）
          examples: [error]
        message:
          type: string
          description: 錯誤訊息
        source:
          type: string
          description: 發生的位置，例如 `app.js:10:5`

    Config:
      type: object
      required:
        - default_model
        - models
        - hardware
        - speakers
        - punctuation
        - watch
        - formats
        - max_upload_mb
        - max_audio_seconds
        - max_text_length
        - max_hotwords_length
        - version
      properties:
        default_model:
          type: string
          description: 預設模型的 `id`
        models:
          type: array
          description: "`models.json` 裡的每個模型，順序相同"
          items:
            $ref: "#/components/schemas/ModelStatus"
        hardware:
          $ref: "#/components/schemas/Hardware"
        speakers:
          description: 分辨說話者的狀態；沒有提供這個功能時是 `null`
          anyOf:
            - $ref: "#/components/schemas/SpeakersFeature"
            - type: "null"
        punctuation:
          description: 自動標點的狀態；沒有提供這個功能時是 `null`
          anyOf:
            - $ref: "#/components/schemas/FeatureStatus"
            - type: "null"
        watch:
          description: 監看資料夾的設定與狀態；沒有監看（`ASR_WATCH_DIR=off`）時是 `null`
          anyOf:
            - $ref: "#/components/schemas/WatchStatus"
            - type: "null"
        formats:
          type: array
          description: 可匯出的格式
          items:
            $ref: "#/components/schemas/ExportFormat"
        max_upload_mb:
          type: integer
          description: 上傳檔案的上限（MB），`ASR_MAX_UPLOAD_MB`
        max_audio_seconds:
          type: integer
          description: 音訊長度上限（秒），`ASR_MAX_AUDIO_SECONDS`
        max_text_length:
          type: integer
          description: 一段字幕的字數上限
        max_hotwords_length:
          type: integer
          description: 熱詞的字數上限
        version:
          type: object
          description: 服務的版本
          required: [current, released]
          properties:
            current:
              type: string
              description: 版本號，例如 `0.6.0`
            released:
              type: [string, "null"]
              format: date
              description: CHANGELOG 記載的發布日期；找不到 CHANGELOG 或沒有這一版的段落時是 `null`

    ModelStatus:
      type: object
      required: [id, name, tagline, description, backend, hotwords, state, error, seconds_per_audio_second]
      properties:
        id:
          type: string
          description: 模型 id，建立工作時填在 `model`
          examples: [MediaTek-Research/Breeze-ASR-25]
        name:
          type: string
          description: 顯示名稱
        tagline:
          type: string
          description: 一句話的適用情境
        description:
          type: string
          description: 說明
        backend:
          type: string
          enum: [local, remote]
          description: "`local` 在這台電腦推論；`remote` 轉呼叫外部辨識服務"
        hotwords:
          type: boolean
          description: 是否支援熱詞（只有本機模型支援）
        state:
          $ref: "#/components/schemas/ModelState"
        error:
          type: [string, "null"]
          description: 準備或載入失敗的原因
        seconds_per_audio_second:
          type: [number, "null"]
          description: 每秒音訊要處理幾秒，是累計處理秒數除以累計音訊秒數：自動調校實測的模型從實測值起算，之後每完成一個工作就加進去；推論子行程重新啟動後重新累計，還沒有任何紀錄時是 `null`
    ModelState:
      type: string
      enum: [waiting, downloading, converting, prepared, loading, ready, failed]
      description: |
        | 值 | 意思 |
        | --- | --- |
        | `waiting` | 推論子行程還沒啟動，或正在等硬體調校 |
        | `downloading` | 從 Hugging Face 下載權重 |
        | `converting` | 轉成 OpenVINO 格式或壓縮權重 |
        | `prepared` | 權重已就緒，還沒載入記憶體（或為了騰出記憶體被卸載） |
        | `loading` | 載入記憶體中 |
        | `ready` | 已載入，可以立即辨識 |
        | `failed` | 準備失敗，原因在 `error` |

    Hardware:
      description: 推論設定的狀態，依 `state` 分成五種。
      oneOf:
        - $ref: "#/components/schemas/HardwareStarting"
        - $ref: "#/components/schemas/HardwareTuning"
        - $ref: "#/components/schemas/HardwareReady"
        - $ref: "#/components/schemas/HardwareFailed"
        - $ref: "#/components/schemas/HardwareNotNeeded"
      discriminator:
        propertyName: state
        mapping:
          starting: "#/components/schemas/HardwareStarting"
          tuning: "#/components/schemas/HardwareTuning"
          ready: "#/components/schemas/HardwareReady"
          failed: "#/components/schemas/HardwareFailed"
          not_needed: "#/components/schemas/HardwareNotNeeded"
    HardwareStarting:
      type: object
      description: 推論子行程啟動中（服務剛啟動、取消處理中的工作，或改用其他設定之後）
      required: [state]
      properties:
        state:
          const: starting
    HardwareTuning:
      type: object
      description: 自動調校中
      required: [state, step]
      properties:
        state:
          const: tuning
        step:
          type: string
          description: 目前的步驟
          examples: [實測 Intel(R) Graphics (iGPU)（OpenVINO GPU・int8）]
        done:
          type: integer
          minimum: 0
          description: 已實測的設定數（實測階段才有）
        total:
          type: integer
          minimum: 1
          description: 預計實測的設定總數（實測階段才有）
    HardwareReady:
      type: object
      description: 推論設定已就緒
      required: [state, settings, summary, tuning, path]
      properties:
        state:
          const: ready
        settings:
          $ref: "#/components/schemas/EngineSettings"
        summary:
          type: string
          description: 一行摘要
          examples: [OpenVINO・GPU・int8]
        tuning:
          description: 自動調校的實測紀錄；手寫的硬體設定檔是 `null`
          anyOf:
            - $ref: "#/components/schemas/TuningRecord"
            - type: "null"
        path:
          type: string
          description: 硬體設定檔的路徑（`ASR_HARDWARE_PROFILE`）
    HardwareFailed:
      type: object
      description: 讀取硬體設定檔或自動調校失敗，本機模型無法使用
      required: [state, error, path]
      properties:
        state:
          const: failed
        error:
          type: string
          description: 失敗原因
        path:
          type: string
          description: 硬體設定檔的路徑
    HardwareNotNeeded:
      type: object
      description: "`models.json` 只有轉呼叫外部服務的模型，不需要調校"
      required: [state]
      properties:
        state:
          const: not_needed

    EngineSettings:
      type: object
      description: 使用中的推論設定，與硬體設定檔的 `settings` 相同。
      required: [engine, device, weight_format, torch_dtype, torch_num_beams, max_loaded_models]
      properties:
        engine:
          type: string
          enum: [openvino, torch]
        device:
          type: string
          description: OpenVINO 的裝置名稱（`CPU`、`GPU`、`GPU.1`…）或 PyTorch 的 `cuda:0` 等
        weight_format:
          type: [string, "null"]
          enum: [fp32, fp16, int8, int4, null]
          description: OpenVINO 的權重格式；PyTorch 是 `null`
        torch_dtype:
          type: [string, "null"]
          enum: [float16, bfloat16, float32, null]
          description: PyTorch 的運算精度；OpenVINO 是 `null`
        torch_num_beams:
          type: [integer, "null"]
          minimum: 1
          description: PyTorch 的 beam search 寬度；OpenVINO 是 `null`
        max_loaded_models:
          type: integer
          minimum: 1
          description: 同時常駐記憶體的模型數

    TuningRecord:
      type: object
      required: [generated_at, hardware, sample, candidates, skipped, reasons]
      properties:
        generated_at:
          type: string
          format: date-time
          description: 調校完成的時間
        hardware:
          $ref: "#/components/schemas/DetectedHardware"
        sample:
          type: object
          description: 實測用的音訊
          required: [model, seconds, source]
          properties:
            model:
              type: string
              description: 實測的模型
            seconds:
              type: number
              description: 音訊長度
            source:
              type: string
              format: uri
              description: 音訊出處
        candidates:
          type: array
          description: 實際實測過的設定
          items:
            $ref: "#/components/schemas/TuningCandidate"
        skipped:
          type: array
          description: 沒有實測的設定與原因
          items:
            type: object
            required: [label, reason]
            properties:
              label:
                type: string
              reason:
                type: string
        reasons:
          type: array
          description: 選擇目前設定的理由；手動改用其他設定後是手動選擇的說明
          items:
            type: string
    TuningCandidate:
      type: object
      required: [label, engine, device, weight_format, torch_dtype, torch_num_beams, status]
      properties:
        label:
          type: string
          description: 顯示名稱，也是 `POST /api/hardware/settings` 的 `label`
        engine:
          type: string
          enum: [openvino, torch]
        device:
          type: string
        weight_format:
          type: [string, "null"]
          enum: [fp32, fp16, int8, int4, null]
        torch_dtype:
          type: [string, "null"]
          enum: [float16, bfloat16, float32, null]
        torch_num_beams:
          type: [integer, "null"]
        status:
          type: string
          enum: [ok, rejected, failed]
          description: "`ok` 可用；`rejected` 跑得起來但錯誤率不合格；`failed` 無法執行"
        reason:
          type: string
          description: "`rejected` 或 `failed` 的原因"
        load_seconds:
          type: number
          description: 載入模型的秒數
        transcribe_seconds:
          type: number
          description: 辨識實測音訊的秒數（取多次中最快的一次）
        memory_bytes:
          type: integer
          description: 執行時的記憶體用量；PyTorch CPU 量不到時是 0
        rtf:
          type: number
          description: 處理時間除以音訊長度，越小越快
        cer:
          type: number
          description: 與參考逐字稿相比的字元錯誤率
    DetectedHardware:
      type: object
      required:
        - os
        - cpu
        - physical_cores
        - usable_threads
        - memory_total_gb
        - memory_available_gb
        - openvino_devices
        - nvidia_gpus
        - amd_gpu_tools
        - torch_gpus
      properties:
        os:
          type: string
        cpu:
          type: string
        physical_cores:
          type: [integer, "null"]
        usable_threads:
          type: integer
          description: 這個行程可用的執行緒數（受 CPU 親和性限制；macOS 沒有 CPU 親和性，是邏輯核心數）
        memory_total_gb:
          type: number
        memory_available_gb:
          type: number
        openvino_devices:
          type: object
          description: OpenVINO 偵測到的裝置，鍵是裝置名稱
          additionalProperties:
            type: object
            required: [name, precisions]
            properties:
              name:
                type: string
              precisions:
                type: array
                items:
                  type: string
              type:
                type: string
                description: "`integrated` 或 `discrete`"
              memory_bytes:
                type: integer
                description: GPU 的記憶體大小
              architecture:
                type: string
                description: "OpenVINO 回報的 `DEVICE_ARCHITECTURE`，GPU 的形式是 `GPU: vendor=0x8086 arch=v12.70.4`；廠商代碼不是 Intel（`0x8086`）的 GPU 不測"
        nvidia_gpus:
          type: array
          items:
            type: object
            required: [index, name]
            properties:
              index:
                type: integer
              name:
                type: string
        amd_gpu_tools:
          type: boolean
          description: 是否找得到 `rocm-smi` 或 `amd-smi`
        torch_build:
          type: [string, "null"]
          description: 安裝的 PyTorch 版本種類，例如 `CUDA 13.0`、`ROCm 7.2`、`CPU`；沒裝 PyTorch 時是 null。加入這個欄位之前調校的設定檔沒有它
        torch_gpus:
          type: array
          items:
            type: object
            required: [index, name, backend]
            properties:
              index:
                type: integer
              name:
                type: string
              backend:
                type: string
                enum: [CUDA, ROCm]

    FeatureStatus:
      type: object
      description: 選用模型的準備狀態。服務啟動時就開始下載。
      required: [state, error]
      properties:
        state:
          type: string
          enum: [downloading, ready, failed]
        error:
          type: [string, "null"]
          description: 下載失敗的原因
    SpeakersFeature:
      allOf:
        - $ref: "#/components/schemas/FeatureStatus"
      type: object
      required: [max_speakers, max_name_length]
      properties:
        max_speakers:
          type: integer
          minimum: 2
          description: 指定人數時的上限
        max_name_length:
          type: integer
          description: 說話者名字的字數上限

    WatchStatus:
      type: object
      required: [directory, model, speakers, punctuation, formats, active, processed, error]
      properties:
        directory:
          type: string
          description: 監看的資料夾
        model:
          type: string
        speakers:
          $ref: "#/components/schemas/SpeakersMode"
        punctuation:
          type: boolean
        formats:
          type: array
          items:
            $ref: "#/components/schemas/ExportFormat"
        active:
          type: integer
          minimum: 0
          description: 處理中的檔案數
        processed:
          type: integer
          minimum: 0
          description: 這次啟動後已處理完的檔案數
        error:
          type: [string, "null"]
          description: 最近一次讀取資料夾或處理失敗的原因

    ExportFormat:
      type: string
      enum: [txt, srt, vtt, ass, md, docx, json]

    Glossary:
      type: object
      additionalProperties: false
      required: [hotwords, replacements]
      properties:
        hotwords:
          type: string
          maxLength: 1000
          description: 熱詞，空字串表示不用
        replacements:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Replacement"
    Replacement:
      type: object
      additionalProperties: false
      required: [find, replace]
      properties:
        find:
          type: string
          minLength: 1
          maxLength: 100
          description: 要找的文字，不可空白
        replace:
          type: string
          maxLength: 100
          description: 換成的文字；空字串表示刪掉

    HotwordsCountRequest:
      type: object
      required: [model, text]
      properties:
        model:
          type: string
          description: 模型 id
        text:
          type: string
          maxLength: 1000
          description: 熱詞
    HotwordsCount:
      type: object
      required: [tokens, limit]
      properties:
        tokens:
          type: integer
          minimum: 0
          description: 熱詞的 token 數；空白時是 0
        limit:
          type: integer
          description: 這個模型能接受的上限

    HardwareChoice:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: "`hardware.tuning.candidates[].label`"

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobStage:
      type: [string, "null"]
      enum: [preparing, loading, transcribing, punctuating, diarizing, null]
      description: |
        處理中的階段；不在處理中時是 `null`。

        | 值 | 意思 |
        | --- | --- |
        | `preparing` | 等模型下載或轉換 |
        | `loading` | 把模型載入記憶體 |
        | `transcribing` | 辨識中（分辨說話者同時在背景進行） |
        | `punctuating` | 加標點 |
        | `diarizing` | 等分辨說話者完成 |
    SpeakersMode:
      type: string
      pattern: ^(off|auto|[1-9][0-9]*)$
      description: "`off` 不分辨；`auto` 自動判斷人數；數字是指定人數（2 到 `max_speakers`）"
      examples: [auto]

    JobSummary:
      type: object
      required: [id, model, filename, audio_seconds, status, stage, created_at, finished_at, segments]
      properties:
        id:
          type: string
        model:
          type: string
        filename:
          type: string
        audio_seconds:
          type: number
        status:
          $ref: "#/components/schemas/JobStatus"
        stage:
          $ref: "#/components/schemas/JobStage"
        created_at:
          type: number
        finished_at:
          type: [number, "null"]
        segments:
          type: [integer, "null"]
          description: 完成後的字幕段數；還沒完成是 `null`
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"

    Job:
      type: object
      required:
        - id
        - model
        - filename
        - audio_seconds
        - status
        - stage
        - speakers_mode
        - created_at
        - finished_at
        - error
        - punctuation
        - hotwords
      properties:
        id:
          type: string
          description: 工作編號
        model:
          type: string
          description: 模型 id
        filename:
          type: string
          description: 上傳的檔名（去掉路徑與控制字元，最多 200 字）
        audio_seconds:
          type: number
          description: 音訊長度
        status:
          $ref: "#/components/schemas/JobStatus"
        stage:
          $ref: "#/components/schemas/JobStage"
        speakers_mode:
          $ref: "#/components/schemas/SpeakersMode"
        created_at:
          type: number
          description: 建立時間（Unix 秒）
        finished_at:
          type: [number, "null"]
          description: 結束時間（成功、失敗或取消）
        error:
          type: [string, "null"]
          description: 失敗原因
        queue_position:
          type: integer
          minimum: 1
          description: 在排隊中的工作裡排第幾（只在排隊中出現）
        jobs_ahead:
          type: integer
          minimum: 0
          description: 前面還有幾個工作，包括處理中的那個（只在排隊中出現）
        stage_elapsed_seconds:
          type: number
          description: 目前階段已經過的秒數（只在 `transcribing`、`diarizing` 出現）
        progress:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: 辨識進度（只在 `transcribing` 出現）；OpenVINO 不回報進度，是 `null`
        estimated_seconds:
          type: [number, "null"]
          description: 預估辨識總秒數（只在 `transcribing` 出現），依 `seconds_per_audio_second` 計算；無法得知時是 `null`
        speakers_progress:
          type: number
          minimum: 0
          maximum: 1
          description: 分辨說話者的進度（處理中且有分辨說話者時出現）
        punctuation:
          type: boolean
          description: 建立時是否要求自動加標點
        hotwords:
          type: string
          description: 使用的熱詞
        result:
          $ref: "#/components/schemas/TranscriptResult"
      allOf:
        - if:
            required: [status]
            properties:
              status:
                const: queued
          then:
            required: [queue_position, jobs_ahead]
        - if:
            required: [status]
            properties:
              status:
                const: succeeded
          then:
            required: [result]
          else:
            not:
              required: [result]
    CreatedJob:
      allOf:
        - $ref: "#/components/schemas/Job"
      type: object
      required: [waveform]
      properties:
        waveform:
          type: array
          description: 把整段音訊等分成 4000 格，每格的峰值，固定 4000 個數字；最大的一格是 1，整段無聲時全是 0
          items:
            type: number
            minimum: 0
            maximum: 1

    TranscriptResult:
      type: object
      required:
        - revision
        - punctuation_error
        - text
        - segments
        - speakers
        - voiceprint_speakers
        - speakers_error
        - audio_seconds
        - processing_seconds
      properties:
        revision:
          type: integer
          minimum: 0
          description: 結果的版本號，每次修改加一；`PUT …/transcript` 要帶上目前的值
        punctuation_error:
          type: [string, "null"]
          description: 自動標點失敗的原因；失敗時字幕保留沒有標點的版本
        text:
          type: string
          description: 全文；修改過後是各段文字以換行相接
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
        speakers:
          description: 說話者清單；不分辨說話者、分辨失敗或沒有偵測到說話聲音時是 `null`，後兩者的原因在 `speakers_error`
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/Speaker"
            - type: "null"
        voiceprint_speakers:
          type: array
          description: 有聲紋、可以記住聲音的說話者編號，包括已被合併掉的（復原時會用到）；手動新增的說話者不在裡面
          items:
            type: string
        speakers_error:
          type: [string, "null"]
          description: 分辨說話者失敗的原因；字幕照常產生
        audio_seconds:
          type: number
        processing_seconds:
          type: number
          description: 辨識花的秒數（不含排隊）
    Segment:
      type: object
      required: [start, end, text, speaker]
      properties:
        start:
          type: number
          minimum: 0
          description: 開始時間（秒）
        end:
          type: number
          description: 結束時間（秒）
        text:
          type: string
        speaker:
          type: [string, "null"]
          description: 說話者編號；不分辨說話者時是 `null`
    Speaker:
      type: object
      required: [id, name, seconds, voice_id, similarity]
      properties:
        id:
          type: string
          pattern: ^S[1-9][0-9]{0,3}$
          description: 說話者編號，依第一次開口的順序是 S1、S2…
        name:
          type: string
          maxLength: 40
          description: 名字；預設是「說話者 1」這類，認出語者庫的人時是他的名字
        seconds:
          type: number
          description: 講話的總秒數
        voice_id:
          type: [string, "null"]
          description: 對應到語者庫的哪個人
        similarity:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: 自動認出時的聲紋相似度；手動對應或沒有對應時是 `null`

    TranscriptUpdate:
      type: object
      required: [revision, segments, speakers]
      properties:
        revision:
          type: integer
          description: 目前的 `result.revision`
        segments:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/SegmentInput"
        speakers:
          description: 有分辨說話者時必須是陣列，否則必須是 `null`
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/SpeakerInput"
            - type: "null"
    SegmentInput:
      type: object
      required: [start, end, text, speaker]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
        text:
          type: string
          minLength: 1
          maxLength: 500
        speaker:
          type: [string, "null"]
    SpeakerInput:
      type: object
      required: [id, name, voice_id, similarity]
      properties:
        id:
          type: string
          pattern: ^S[1-9][0-9]{0,3}$
        name:
          type: string
          minLength: 1
          maxLength: 40
        voice_id:
          type: [string, "null"]
        similarity:
          type: [number, "null"]
          minimum: 0
          maximum: 1
    SpeakerNameUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
    SegmentTextUpdate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    ExportJson:
      type: object
      required: [text, segments, audio_seconds, processing_seconds]
      properties:
        text:
          type: string
        segments:
          type: array
          items:
            type: object
            required: [start, end, text]
            properties:
              start:
                type: number
              end:
                type: number
              text:
                type: string
              speaker:
                type: string
                description: 說話者編號（有分辨說話者時才有）
              speaker_name:
                type: string
                description: 說話者名字（有分辨說話者時才有）
        audio_seconds:
          type: number
        processing_seconds:
          type: number
        speakers:
          type: array
          description: 有分辨說話者時才有
          items:
            type: object
            required: [id, name, seconds]
            properties:
              id:
                type: string
              name:
                type: string
              seconds:
                type: number

    CreateJobForm:
      type: object
      required: [model, speakers, punctuation, file]
      properties:
        model:
          type: string
          description: "`GET /api/config` 的 `models[].id`"
        speakers:
          type: string
          pattern: ^(off|auto|[0-9]+)$
          description: "`off`（不分辨）、`auto`（自動判斷人數）或 2 到 `max_speakers` 的人數；沒有提供分辨說話者時只能是 `off`"
        punctuation:
          type: string
          enum: ["on", "off"]
          description: 辨識後自動加標點；沒有提供自動標點時只能是 `off`
        hotwords:
          type: string
          default: ""
          maxLength: 1000
          description: 熱詞，例如「與會者有王小明、陳美玲，會中提到 Kubernetes。」；不給或空字串表示不用。連續空白合併後最多 1000 字，且不可超過模型的 token 上限（見 `POST /api/hotwords/count`）。轉呼叫外部服務的模型不能給。
        file:
          description: 音訊或影片檔，ffmpeg 讀得到的格式都可以（m4a、mp3、wav、flac、ogg、opus、webm、mp4、mov、mkv…）
          contentMediaType: application/octet-stream
    CreateRenderForm:
      type: object
      required: [file]
      properties:
        file:
          description: 這份字幕的原始影片
          contentMediaType: application/octet-stream

    Render:
      type: object
      required: [id, job_id, status, progress, error, filename, created_at, finished_at]
      properties:
        id:
          type: string
          description: 燒錄工作編號
        job_id:
          type: string
          description: 字幕來源的工作
        status:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled]
        progress:
          type: number
          minimum: 0
          maximum: 1
        error:
          type: [string, "null"]
          description: 失敗原因（ffmpeg 錯誤輸出的最後幾行）
        filename:
          type: string
          description: 下載時的檔名
          examples: [lecture-字幕.mp4]
        created_at:
          type: number
        finished_at:
          type: [number, "null"]

    Voice:
      type: object
      required: [id, name, samples, outdated, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        samples:
          type: integer
          minimum: 0
          description: 記住過幾次
        outdated:
          type: boolean
          description: 舊版留下、聲紋格式不相容的紀錄；不會被自動認出，再記住一次就會更新，`samples` 從 0 起算
        created_at:
          type: number
        updated_at:
          type: number
    VoiceList:
      type: object
      required: [voices]
      properties:
        voices:
          type: array
          items:
            $ref: "#/components/schemas/Voice"
    RememberVoiceRequest:
      type: object
      required: [job_id, speaker_id]
      properties:
        job_id:
          type: string
        speaker_id:
          type: string
          examples: [S1]
    RememberVoiceResult:
      type: object
      required: [voice, job]
      properties:
        voice:
          type: object
          required: [id, name, samples]
          properties:
            id:
              type: string
            name:
              type: string
            samples:
              type: integer
              minimum: 1
        job:
          $ref: "#/components/schemas/Job"
