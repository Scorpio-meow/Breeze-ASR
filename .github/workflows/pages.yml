name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv run --frozen --only-group site python site/tools/subset_fonts.py check --font site/fonts/noto-sans-tc.woff2 site/index.html site/main.js site/styles.css
      - run: rsync -a --exclude tools site/ _site/
      - id: pages
        uses: actions/configure-pages@v6
      - run: |
          python3 site/tools/stamp_release.py --pyproject pyproject.toml --changelog CHANGELOG.md --base-url "$BASE_URL" _site/index.html
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>%s/</loc>\n    <lastmod>%s</lastmod>\n  </url>\n</urlset>\n' "${BASE_URL%/}" "$(git log -1 --format=%cI -- site pyproject.toml CHANGELOG.md)" > _site/sitemap.xml
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
