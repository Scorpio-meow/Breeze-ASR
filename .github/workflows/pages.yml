name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: rsync -a --exclude tools site/ _site/
      - run: python3 site/tools/stamp_release.py --pyproject pyproject.toml --changelog CHANGELOG.md _site/index.html
      - id: pages
        uses: actions/configure-pages@v6
      - run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>%s/</loc>\n    <lastmod>%s</lastmod>\n  </url>\n</urlset>\n' "${BASE_URL%/}" "$(git log -1 --format=%cI)" > _site/sitemap.xml
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
