name: 問題回報
description: 辨識失敗、介面錯誤、安裝或部署問題
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感謝回報。安全性問題請不要在這裡公開，改依 SECURITY.md 私下回報；介面無法操作或閱讀的問題請改用「無障礙問題」範本。
  - type: textarea
    id: description
    attributes:
      label: 發生了什麼事
      description: 簡短說明問題。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      placeholder: |
        1. 選擇模型 Breeze ASR 26
        2. 開啟一個 10 分鐘的 m4a 檔
        3. 按「辨識」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期與實際結果
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 執行方式
      options:
        - Windows 安裝腳本
        - Linux 安裝腳本
        - Docker（自行建置）
        - Docker（GitHub 發布的映像檔）
        - 手動 uv
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: 模型
      options:
        - Breeze ASR 25
        - Breeze ASR 26
        - 其他（請在補充說明）
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 推論設定
      description: 工具列「硬體」顯示的設定，例如 OpenVINO・GPU・int8。
  - type: input
    id: environment
    attributes:
      label: 作業系統與硬體
      placeholder: Windows 11、Intel Core Ultra 7 155U、32 GB
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日誌
      description: 終端機輸出或 docker compose logs 的相關片段。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私
      options:
        - label: 我沒有附上含個人資料的錄音、逐字稿或聲紋檔
          required: true
